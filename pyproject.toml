[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "esp32-serial-scope"
version = "0.1.0"
description = "Plot ESP32 / microcontroller serial key:value output as live terminal charts."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "esp32-serial-scope contributors" }]
keywords = [
    "esp32",
    "esp32-s3",
    "serial",
    "serial-monitor",
    "oscilloscope",
    "scope",
    "pyserial",
    "matplotlib",
    "embedded",
    "arduino",
    "sensor",
    "debugging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Debuggers",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "pyserial>=3.4",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "twine>=4.0",
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/ljn66666/esp32-serial-scope"
Repository = "https://github.com/ljn66666/esp32-serial-scope"
Issues = "https://github.com/ljn66666/esp32-serial-scope/issues"

[project.scripts]
esp32-serial-scope = "esp32_serial_scope.cli:main"

[tool.setuptools]
packages = ["esp32_serial_scope"]
